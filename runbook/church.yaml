church: Church stream
service_name: Sunday service
# Turn this on when the service should already be live on YouTube.
expect_stream_live: false

house_mix:
  obs_name: Audio Input Capture
  windows_device: Microphone (X-USB)
  role: >
    One combined Behringer X32 USB feed. Pulpit, handheld, and playback are
    mixed on the board before they reach OBS, so this is one fader, not one mic.
    The X32 itself is watched separately over OSC.
  target_db: -2
  warn_below_db: -20

# The mixer is a separate OSC connection. OBS still receives one X-USB feed.
# Names below were read off the channel 1-16 scribbles. A blank strip is not a guess.
# Channels 17-32 are not readable in the photos, so the pulpit strip stays empty.
board:
  name: Behringer X32
  link: osc
  usb_source: main
  channels:
    - id: pulpit
      role: Pulpit mic
      kind: channel
      strip: ""
      name: ""
    - id: handheld
      role: Handheld mic
      kind: channel
      strip: ""
      name: ""
    - id: playback
      role: Playback
      kind: channel
      strip: ""
      name: ""
    - id: main
      role: Main mix
      kind: main
      strip: ""
      name: ""
  # Optional YouTube mix. Leave strip empty until a bus or matrix is routed
  # to the USB card. OBS still sees that card as one Microphone (X-USB) input.
  stream_mix:
    id: stream
    role: Stream mix
    kind: bus
    strip: ""
    name: ""
  labels:
    - strip: 1
      name: Worship
    - strip: 2
      name: Worship
    - strip: 3
      name: Worship
    - strip: 4
      name: Worship
    - strip: 5
      name: Worship
    - strip: 6
      name: Worship
    - strip: 7
      name: Worship
    - strip: 8
      name: Worship
    - strip: 9
      name: Worship
    - strip: 10
      name: Keys L
    - strip: 11
      name: Piano L
    - strip: 12
      name: Piano R
    - strip: 13
      name: Offering
    - strip: 14
      name: Moderator
    - strip: 15
      name: Reception
    - strip: 16
      name: Speaker

sources:
  - obs_name: Wall Cam
    role: Stage camera, USB capture card
    audio: muted on purpose
  - obs_name: Mobile Cam
    role: Mobile camera, USB capture card
    audio: muted on purpose
  - obs_name: Slide PC
    role: Lyrics and slides computer, USB capture card
    audio: muted on purpose
  - obs_name: Display Capture
    role: Service PC monitor (Acer)
    audio: none

scenes:
  - name: 1-Stage Only
    picture: Wall Cam filling the frame
  - name: 2-Slide Only
    picture: Slide PC filling the frame
  - name: 3-Stage 50/Slide 50
    picture: Wall Cam and Slide PC, split evenly
  - name: 4-Stage 100/Slide 30
    picture: Wall Cam full, Slide PC small
  - name: 5-Stage 30/Slide 70
    picture: Wall Cam small, Slide PC larger
  - name: 6-Stage 30/Slide 100
    picture: Slide PC full, Wall Cam small
  - name: 7-Mobile Cam 50/Slide 50
    picture: Mobile Cam and Slide PC, split evenly
  - name: 8-Mobile Cam Only
    picture: Mobile Cam filling the frame
  - name: 9-Studio (Wall Cam + Mobile Cam)
    picture: Wall Cam and Mobile Cam together
  - name: 10-Acer Monitor
    picture: The service PC's own screen
  - name: 11-Acer 70 + Slide 30
    picture: The service PC's screen large, Slide PC small

# No control interface was visible for these. The booth does not poll them.
rack:
  - name: ADJ PC-100A
    note: Physical power switches only. No remote telemetry.
  - name: Amplifiers
    note: No control interface on the rack. Not monitored.
  - name: Wireless receivers
    note: No control interface on the rack. Not monitored.
  - name: Lighting controller
    note: No control interface on the rack. Not monitored.
