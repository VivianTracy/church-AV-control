[project]
name = "church-av"
version = "0.1.0"
description = "Booth agent that reads OBS on the service PC and, optionally, the X32 over OSC."
requires-python = ">=3.11"
dependencies = [
  "obsws-python>=1.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
agent = ["google-adk>=1.18"]

[project.scripts]
church-av = "church_av.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
